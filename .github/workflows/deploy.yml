name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So the site can be redeployed without a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Required by actions/deploy-pages: it exchanges this for a deployment token.
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but never
# queue more than one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run check

      # The E2E sweep is this project's real safety net: it drives the app through the
      # buttons a person uses. It runs against the dev server on :5199, without
      # BASE_PATH, because the dev server serves from the root.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npx vite dev --port 5199 &
          # Polled with curl rather than a helper package: nothing here should pull an
          # unpinned dependency from the network mid-run.
          for i in $(seq 1 60); do
            curl -sf http://localhost:5199 >/dev/null && exit 0
            sleep 1
          done
          echo "dev server did not come up on :5199"; exit 1

      - name: End-to-end checks
        run: npm run e2e

      # Only the Pages build gets a base path. A project site is served from
      # /<repo>/, and the repository name is the path.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # Stored as secrets, not variables. Both are publishable client-side values
          # (they ship in the bundle), so secrecy is not the point -- it is just where
          # they happen to live. Reading `vars.` here left them empty and the deploy
          # silently built the no-account v1 app: no Google sign-in, no sync.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # Used by the Sentry Vite plugin to upload source maps after each build.
          # Without this the plugin is disabled silently and stack traces are minified.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: Guard against Jekyll eating the app
        run: |
          # Pages runs Jekyll, which drops directories beginning with an underscore --
          # and SvelteKit puts the whole app in _app/. Without this file the site
          # deploys "successfully" and then 404s every script.
          test -f build/.nojekyll || { echo "build/.nojekyll missing"; exit 1; }

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
