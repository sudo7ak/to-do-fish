<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- ── Viewport & theme ─────────────────────────────────────── -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#4FC3D9" />

		<!-- ── Content Security Policy ──────────────────────────────── -->
		<!--
		  GitHub Pages cannot set HTTP headers, so this meta tag is the only
		  available mechanism. Limitations vs a header: does not cover
		  navigations, form actions, or workers.

		  script-src 'unsafe-inline': SvelteKit's hydration bootstrap injects an
		  inline <script> block whose hash changes with every build. adapter-static
		  has no nonce support, so 'unsafe-inline' is the only practical option.
		  The real XSS escalation paths are still blocked: object-src 'none'
		  prevents plugin execution, and base-uri 'self' prevents base-tag hijacking.

		  style-src 'unsafe-inline': required by SvelteKit's scoped CSS injection
		  (inline <style> blocks per component).

		  wss://*.supabase.co: the Supabase JS client opens a WebSocket for
		  Realtime subscriptions even when only REST sync is used.

		  https://cdn4.buysellads.net: Carbon Ads serves images from this CDN.
		  Carbon script is consent-gated; this origin only matters after accept.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src 'self';
				script-src  'self' 'unsafe-inline' https://cloud.umami.is https://cdn.carbonads.com;
				style-src   'self' 'unsafe-inline';
				img-src     'self' data: https://cdn.carbonads.com https://cdn4.buysellads.net;
				connect-src 'self' https://*.supabase.co wss://*.supabase.co;
				font-src    'self';
				frame-src   'none';
				object-src  'none';
				base-uri    'self';
				form-action 'self';
			"
		/>

		<!-- ── Identity ─────────────────────────────────────────────── -->
		<title>Fish Tank To-Do</title>
		<meta name="description" content="A to-do app where every task is a fish. Watch your aquarium grow as you get things done." />
		<link rel="canonical" href="https://to-do-fish.com/" />

		<!-- ── Icons ────────────────────────────────────────────────── -->
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		<!-- ── PWA manifest ─────────────────────────────────────────── -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<!-- ── Apple PWA meta ───────────────────────────────────────── -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Fish Tank" />

		<!-- ── Open Graph (Facebook, Slack, iMessage, LinkedIn) ─────── -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://to-do-fish.com/" />
		<meta property="og:title" content="Fish Tank To-Do" />
		<meta property="og:description" content="A to-do app where every task is a fish. Watch your aquarium grow as you get things done." />
		<meta property="og:image" content="https://to-do-fish.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:site_name" content="Fish Tank To-Do" />
		<meta property="og:locale" content="en_GB" />

		<!-- ── Twitter / X Card ─────────────────────────────────────── -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Fish Tank To-Do" />
		<meta name="twitter:description" content="A to-do app where every task is a fish. Watch your aquarium grow as you get things done." />
		<meta name="twitter:image" content="https://to-do-fish.com/og-image.png" />

		<!-- ── Structured data (JSON-LD) ───────────────────────────── -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebApplication",
			"name": "Fish Tank To-Do",
			"url": "https://to-do-fish.com/",
			"description": "A to-do app where every task is a fish. Watch your aquarium grow as you get things done.",
			"applicationCategory": "ProductivityApplication",
			"operatingSystem": "Any",
			"browserRequirements": "Requires a modern browser with JavaScript enabled.",
			"offers": {
				"@type": "Offer",
				"price": "0",
				"priceCurrency": "GBP"
			},
			"aggregateRating": {
				"@type": "AggregateRating",
				"ratingValue": "5",
				"ratingCount": "1",
				"bestRating": "5",
				"worstRating": "1"
			},
			"author": {
				"@type": "Person",
				"url": "https://github.com/sudo7ak"
			}
		}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
